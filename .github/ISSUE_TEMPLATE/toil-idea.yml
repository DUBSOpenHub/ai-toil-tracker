name: Toil Automation Idea
description: Log a repetitive task that could be automated
title: "[TOIL] "
labels: [toil, triage]
body:
  - type: markdown
    attributes:
      value: |
        📍 **Where to review all submissions:**
        Use the links in the repo README to view all ideas, triage queue, in-progress, and completed items.

  - type: markdown
    attributes:
      value: |
        ⚠️ **Security reminder:** keep descriptions high-level—don't paste secrets, customer data, or internal-only URLs. See `SECURITY.md` for details.

  - type: input
    id: submitter
    attributes:
      label: Your name and GitHub handle
      description: So the team knows who submitted this and can tag you on updates
      placeholder: e.g. Jane Smith (@janesmith)
    validations:
      required: true

  - type: input
    id: team
    attributes:
      label: What team or group are you on?
      description: Used to group and filter toil ideas by team in the dashboard
      placeholder: e.g. Platform, DevEx, SRE, Marketing
    validations:
      required: true

  - type: textarea
    id: toil
    attributes:
      label: What's the toil?
      description: Describe the repetitive task
      placeholder: e.g. "I manually copy deploy logs into a spreadsheet after every release"
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does it happen?
      options:
        - 🔴 Multiple times per day
        - 🟠 Daily
        - 🟡 Multiple times per week
        - 🔵 Weekly
        - ⚪ Monthly or less
    validations:
      required: true

  - type: dropdown
    id: time-per-occurrence
    attributes:
      label: How long does it take each time?
      options:
        - "< 5 minutes"
        - "5–15 minutes"
        - "15–30 minutes"
        - "30–60 minutes"
        - "> 1 hour"
    validations:
      required: true

  - type: dropdown
    id: people-affected
    attributes:
      label: Who is affected?
      options:
        - Just me
        - 2–3 people
        - 4–6 people
        - Entire team
        - Multiple teams / org-wide
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: What area does this toil fall under?
      description: "Optional — helps with dashboard filtering. Skip if unsure!"
      options:
        - 🔧 CI/CD & Builds
        - 💬 Communication & Reporting
        - 👥 Onboarding & Access
        - 🔍 Code Review & Quality
        - 🖥️ Operations & Infrastructure
        - 📝 Documentation
        - 📊 Data & Analytics
        - 🔄 Other
    validations:
      required: false

  - type: checkboxes
    id: bonus-factors
    attributes:
      label: Does this toil have any of these extra impacts? (optional)
      description: Check any that apply — these boost the priority score
      options:
        - label: "❌ Error-prone (+2) — frequently causes mistakes or rework"
        - label: "😤 Morale killer (+1) — drains energy or causes frustration"
        - label: "🔗 Blocking (+3) — blocks other work until completed"

  - type: textarea
    id: automation-idea
    attributes:
      label: Automation idea (optional)
      description: How might an agent, script, or workflow handle this?
      placeholder: Optional — leave blank if you're not sure
    validations:
      required: false
