name: AI Triage - Auto-score and label new toil ideas
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to triage'
        required: true

permissions:
  issues: write
  models: read

jobs:
  ai-triage:
    if: contains(github.event.issue.labels.*.name, 'toil') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Get issue body
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ISSUE_NUM=${{ github.event.inputs.issue_number }}
          else
            ISSUE_NUM=${{ github.event.issue.number }}
          fi
          echo "number=$ISSUE_NUM" >> "$GITHUB_OUTPUT"

          BODY=$(gh issue view "$ISSUE_NUM" --repo "${{ github.repository }}" --json body --jq '.body')
          echo "$BODY" > /tmp/issue_body.txt

      - name: Parse form fields and calculate score
        id: score
        run: |
          BODY=$(cat /tmp/issue_body.txt)

          # Parse frequency from issue form dropdown.
          # Uses -i (case-insensitive) and short discriminating substrings
          # so scoring survives minor template text or emoji changes.
          if echo "$BODY" | grep -qi "times per day"; then
            FREQ_SCORE=8
            FREQ_LABEL="🔴 multiple-times-daily"
            FREQ_TEXT="multiple times per day"
          elif echo "$BODY" | grep -qi "times per week"; then
            # Check "times per week" before "daily" so "multiple times per week"
            # isn't accidentally caught by a loose "daily" match.
            FREQ_SCORE=3
            FREQ_LABEL="🟡 multiple-times-weekly"
            FREQ_TEXT="multiple times per week"
          elif echo "$BODY" | grep -qi "daily"; then
            FREQ_SCORE=5
            FREQ_LABEL="🟠 daily"
            FREQ_TEXT="daily"
          elif echo "$BODY" | grep -qi "weekly"; then
            FREQ_SCORE=2
            FREQ_LABEL="🔵 weekly"
            FREQ_TEXT="weekly"
          else
            FREQ_SCORE=1
            FREQ_LABEL="⚪ monthly"
            FREQ_TEXT="monthly or less"
          fi

          # Parse time per occurrence from issue form dropdown.
          # Matches short keywords; order matters (check longest ranges first).
          if echo "$BODY" | grep -qi "1 hour"; then
            TIME_SCORE=8
          elif echo "$BODY" | grep -qi "30.*60 min"; then
            TIME_SCORE=5
          elif echo "$BODY" | grep -qi "15.*30 min"; then
            TIME_SCORE=3
          elif echo "$BODY" | grep -qi "5.*15 min"; then
            TIME_SCORE=2
          else
            TIME_SCORE=1
          fi

          # Parse people affected from issue form dropdown.
          # Uses short discriminating phrases with case-insensitive matching.
          if echo "$BODY" | grep -qi "multiple teams"; then
            PEOPLE_SCORE=8
          elif echo "$BODY" | grep -qi "entire team"; then
            PEOPLE_SCORE=5
          elif echo "$BODY" | grep -qi "4.*6 people"; then
            PEOPLE_SCORE=3
          elif echo "$BODY" | grep -qi "2.*3 people"; then
            PEOPLE_SCORE=2
          else
            PEOPLE_SCORE=1
          fi

          # Calculate toil score
          TOIL_SCORE=$((FREQ_SCORE * TIME_SCORE * PEOPLE_SCORE))

          # Determine priority
          if [ "$TOIL_SCORE" -ge 40 ]; then
            PRIORITY="🔴 Critical - automate immediately"
            PRIORITY_LABEL="high-impact"
          elif [ "$TOIL_SCORE" -ge 20 ]; then
            PRIORITY="🟡 High - automate this sprint"
            PRIORITY_LABEL="high-impact"
          elif [ "$TOIL_SCORE" -ge 10 ]; then
            PRIORITY="🟢 Medium - add to backlog"
            PRIORITY_LABEL=""
          else
            PRIORITY="⚪ Low - track but don't prioritize"
            PRIORITY_LABEL=""
          fi

          # Estimate monthly time saved
          case $FREQ_SCORE in
            8) MONTHLY_MULT=60 ;;
            5) MONTHLY_MULT=20 ;;
            3) MONTHLY_MULT=10 ;;
            2) MONTHLY_MULT=4 ;;
            *) MONTHLY_MULT=1 ;;
          esac

          case $TIME_SCORE in
            8) MINS=75 ;;
            5) MINS=45 ;;
            3) MINS=22 ;;
            2) MINS=10 ;;
            *) MINS=3 ;;
          esac

          MONTHLY_MINS=$((MONTHLY_MULT * MINS * PEOPLE_SCORE))
          if [ "$MONTHLY_MINS" -ge 60 ]; then
            MONTHLY_SAVED="~$((MONTHLY_MINS / 60)) hours/month"
          else
            MONTHLY_SAVED="~${MONTHLY_MINS} minutes/month"
          fi

          # Extract toil description for AI prompt
          TOIL_DESC=$(echo "$BODY" | sed -n '/What'\''s the toil/,/How often/p' | head -n -1 | tail -n +2)
          echo "$TOIL_DESC" > /tmp/toil_desc.txt

          echo "freq_score=$FREQ_SCORE" >> "$GITHUB_OUTPUT"
          echo "time_score=$TIME_SCORE" >> "$GITHUB_OUTPUT"
          echo "people_score=$PEOPLE_SCORE" >> "$GITHUB_OUTPUT"
          echo "toil_score=$TOIL_SCORE" >> "$GITHUB_OUTPUT"
          echo "priority=$PRIORITY" >> "$GITHUB_OUTPUT"
          echo "priority_label=$PRIORITY_LABEL" >> "$GITHUB_OUTPUT"
          echo "freq_label=$FREQ_LABEL" >> "$GITHUB_OUTPUT"
          echo "monthly_saved=$MONTHLY_SAVED" >> "$GITHUB_OUTPUT"

      - name: AI - Suggest automation approach
        id: ai
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOIL_DESC=$(cat /tmp/toil_desc.txt)
          BODY=$(cat /tmp/issue_body.txt)

          PROMPT="You are an automation advisor. A team member submitted this toil item:

          ${BODY}

          Suggest a specific, practical automation approach in 3-4 sentences. Focus on:
          1. The best tool for the job (GitHub Action, script, Copilot agent, Slack workflow, API integration, etc.)
          2. A brief description of how it would work
          3. Estimated effort to build (hours/days)

          Be concise and practical. No fluff."

          REQUEST_BODY_TEMPLATE='{"messages":[{"role":"user","content":"PLACEHOLDER"}],"max_tokens":300,"temperature":0.7}'

          # Try each model in order; stop on first success
          MODELS=("openai/gpt-4o-mini" "openai/gpt-4o")
          RESPONSE=""

          for MODEL in "${MODELS[@]}"; do
            echo "🔄 Trying model: $MODEL"

            HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" \
              "https://models.github.ai/inference/chat/completions" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg prompt "$PROMPT" --arg model "$MODEL" '{
                "model": $model,
                "messages": [{"role": "user", "content": $prompt}],
                "max_tokens": 300,
                "temperature": 0.7
              }')")

            HTTP_STATUS=$(echo "$HTTP_RESPONSE" | tail -1)
            BODY_RESPONSE=$(echo "$HTTP_RESPONSE" | sed '$d')

            if [ "$HTTP_STATUS" -ge 200 ] 2>/dev/null && [ "$HTTP_STATUS" -lt 300 ] 2>/dev/null; then
              RESPONSE=$(echo "$BODY_RESPONSE" | jq -r '.choices[0].message.content // empty')
              if [ -n "$RESPONSE" ]; then
                echo "✅ Success with $MODEL"
                break
              else
                echo "⚠️ $MODEL returned 200 but empty content, trying next model..."
              fi
            else
              echo "⚠️ $MODEL returned HTTP $HTTP_STATUS, trying next model..."
            fi
          done

          # Fallback message if all models failed
          if [ -z "$RESPONSE" ]; then
            echo "❌ All models failed"
            RESPONSE="⚠️ AI suggestion temporarily unavailable. The triage scoring above is still valid — a team member can manually review automation options."
          fi

          # Escape for GitHub output
          {
            echo "suggestion<<SUGGESTION_EOF"
            echo "$RESPONSE"
            echo "SUGGESTION_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Apply labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM=${{ steps.issue.outputs.number }}
          REPO="${{ github.repository }}"

          # Add frequency label
          gh issue edit "$ISSUE_NUM" --repo "$REPO" --add-label "${{ steps.score.outputs.freq_label }}"

          # Add priority label if high enough
          if [ -n "${{ steps.score.outputs.priority_label }}" ]; then
            gh issue edit "$ISSUE_NUM" --repo "$REPO" --add-label "${{ steps.score.outputs.priority_label }}"
          fi

          # Remove triage label (auto-triaged by AI)
          gh issue edit "$ISSUE_NUM" --repo "$REPO" --remove-label "triage" || true

      - name: Post triage comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM=${{ steps.issue.outputs.number }}

          COMMENT="## 🤖 AI Triage Report

          **Toil Score:** Frequency (${{ steps.score.outputs.freq_score }}) x Time (${{ steps.score.outputs.time_score }}) x People (${{ steps.score.outputs.people_score }}) = **${{ steps.score.outputs.toil_score }}**

          **Priority:** ${{ steps.score.outputs.priority }}

          **Estimated team time saved if automated:** ${{ steps.score.outputs.monthly_saved }}

          ---

          ### 💡 Suggested Automation Approach

          ${{ steps.ai.outputs.suggestion }}

          ---

          _This issue was auto-triaged by AI. Labels and score have been applied. Review the [scoring guide](../blob/main/docs/scoring-guide.md) for details._"

          gh issue comment "$ISSUE_NUM" --repo "${{ github.repository }}" --body "$COMMENT"

      - name: AI - Generate starter code
        id: ai_code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TOIL_DESC=$(cat /tmp/toil_desc.txt)
          SUGGESTION="${{ steps.ai.outputs.suggestion }}"

          CODE_PROMPT="You are an automation engineer. A team submitted this toil item:

          ${TOIL_DESC}

          An advisor suggested this approach:

          ${SUGGESTION}

          Generate a starter implementation for this automation suggestion. Output a GitHub Actions workflow YAML or bash script.
          Include comments explaining each section. Keep it practical and ready to customize.
          Output ONLY the code, no extra explanation."

          CODE_RESPONSE=$(curl -s "https://models.github.ai/inference/chat/completions" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg prompt "$CODE_PROMPT" '{
              "model": "openai/gpt-4o-mini",
              "messages": [{"role": "user", "content": $prompt}],
              "max_tokens": 800,
              "temperature": 0.3
            }')" | jq -r '.choices[0].message.content // "Unable to generate starter code at this time."')

          # Save to file to avoid output escaping issues
          echo "$CODE_RESPONSE" > /tmp/starter_code.txt

      - name: Post starter code comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_NUM=${{ steps.issue.outputs.number }}
          STARTER_CODE=$(cat /tmp/starter_code.txt)

          CODE_COMMENT="## 🛠️ AI-Generated Starter Code

          Here's a starter implementation based on the suggested automation approach above:

          \`\`\`
          ${STARTER_CODE}
          \`\`\`

          ---

          _⚠️ This is AI-generated starter code. Review, test, and customize before using in production._"

          gh issue comment "$ISSUE_NUM" --repo "${{ github.repository }}" --body "$CODE_COMMENT"

      - name: Send webhook notification
        if: ${{ vars.WEBHOOK_URL != '' || secrets.WEBHOOK_URL != '' }}
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL || vars.WEBHOOK_URL }}
        run: |
          ISSUE_NUM=${{ steps.issue.outputs.number }}
          TOIL_SCORE=${{ steps.score.outputs.toil_score }}
          PRIORITY="${{ steps.score.outputs.priority }}"
          MONTHLY_SAVED="${{ steps.score.outputs.monthly_saved }}"
          SUGGESTION=$(echo '${{ steps.ai.outputs.suggestion }}' | head -c 500)
          ISSUE_URL="${{ github.server_url }}/${{ github.repository }}/issues/${ISSUE_NUM}"

          PAYLOAD=$(jq -n \
            --arg title "🤖 New Toil Idea Triaged (#${ISSUE_NUM})" \
            --arg score "$TOIL_SCORE" \
            --arg priority "$PRIORITY" \
            --arg saved "$MONTHLY_SAVED" \
            --arg suggestion "$SUGGESTION" \
            --arg url "$ISSUE_URL" \
            '{
              text: "\($title)\nScore: \($score) | \($priority)\nTime saved: \($saved)\n\($suggestion)\n\($url)",
              title: $title,
              issue_number: ($score | tonumber),
              toil_score: ($score | tonumber),
              priority: $priority,
              monthly_saved: $saved,
              suggestion: $suggestion,
              issue_url: $url
            }')

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Webhook notification sent (HTTP $HTTP_STATUS)"
          else
            echo "⚠️ Webhook returned HTTP $HTTP_STATUS (non-fatal)"
          fi
