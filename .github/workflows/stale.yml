name: Stale Toil Reminder

# Runs monthly to nudge inactive toil ideas
on:
  workflow_dispatch:  # Allows manual testing
  schedule:
    - cron: '0 18 1 * *'  # 1st of each month at 10am PST (18:00 UTC)

permissions: {}

jobs:
  stale-check:
    runs-on: ubuntu-latest
    permissions:
      issues: write  # Required to comment and close stale issues
    steps:
      - uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10.0.0
        with:
          stale-issue-message: >
            👋 This toil idea has been idle for 30 days.
            Still a problem? Drop a comment and we'll keep it open.
            If it's been solved another way, feel free to close it! 🎉
          stale-issue-label: stale
          days-before-stale: 30
          days-before-close: 60
          close-issue-message: >
            🗂️ Closing this due to inactivity — the toil may have faded!
            If it's still an issue, reopen anytime. No judgment. 💪
          exempt-issue-labels: 'in-progress,automated,high-impact'
