name: Stale Toil Reminder
on:
  workflow_dispatch:  # allows manual testing
  schedule:
    - cron: '0 18 1 * *'  # 1st of each month at 10am PST (18:00 UTC)

jobs:
  stale-check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/stale@v10
        with:
          stale-issue-message: >
            👋 Hey! This toil idea has been chilling for 30 days.
            Still hurting? Drop a comment and we'll keep it alive.
            Or if it's been solved another way, feel free to close it! 🎉
          stale-issue-label: stale
          days-before-stale: 30
          days-before-close: 60
          close-issue-message: >
            🗂️ Archiving this one — the toil may have faded!
            If it's still bugging you, reopen anytime. No judgment. 💪
          exempt-issue-labels: 'in-progress,automated,high-impact'
