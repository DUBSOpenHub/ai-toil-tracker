<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">AI Toil Tracker: Less toil. More impact.</title>
  <desc id="description">An interactive demo invitation beside a dashboard showing 30.6 hours of monthly open toil, 37.3 hours reclaimed, and the five biggest time drains. All numbers are illustrative demo data.</desc>
  <defs>
    <radialGradient id="glow" cx="83%" cy="22%" r="85%">
      <stop offset="0" stop-color="#1c0f2d"/>
      <stop offset=".5" stop-color="#0b0d1d"/>
      <stop id="canvas-edge" offset="1" stop-color="#070914"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop id="accent-start" stop-color="#a56bff"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="drain">
      <stop stop-color="#1a1d30"/>
      <stop offset="1" stop-color="#141726"/>
    </radialGradient>
    <linearGradient id="progress" x1="57" y1="0" x2="228" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d400ff"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#3a4167" stroke-opacity=".2"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#02040c" flood-opacity=".6"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="20" y="20" width="1160" height="590" rx="28" fill="none" stroke="#c4b5fd" stroke-opacity=".12"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <path d="M77 52 59 77h15l-5 21 24-30H78l7-16Z" fill="url(#accent)"/>
    <text x="108" y="83" fill="#f7faff" font-size="24" font-weight="700" letter-spacing="-.6">AI Toil Tracker</text>
    <rect x="925" y="54" width="223" height="36" rx="18" fill="#1c0f2d" stroke="#a56bff"/>
    <circle cx="947" cy="72" r="4" fill="#a56bff"/>
    <text x="962" y="77" fill="#dec0ff" font-size="12" font-weight="700" letter-spacing="1.4">INTERACTIVE DEMO</text>

    <text id="headline" x="60" y="213" fill="#f7faff" font-size="78" font-weight="700" letter-spacing="-3.5">Less toil.</text>
    <text x="60" y="298" fill="url(#accent)" font-size="76" font-weight="700" letter-spacing="-3.8">More impact.</text>
    <text x="63" y="352" fill="#b9c4e6" font-size="23">Find the busywork worth automating.</text>
    <text x="63" y="387" fill="#b9c4e6" font-size="23">See the hours your team gets back.</text>
    <rect x="60" y="428" width="270" height="55" rx="27.5" fill="url(#button)"/>
    <text x="85" y="463" fill="#fff" font-size="19" font-weight="700">Explore the demo</text>
    <path d="M288 455h17m-7-7 7 7-7 7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="63" y="555" fill="#b9c4e6" font-size="12" font-weight="700" letter-spacing="1.8">OPEN SOURCE  /  GITHUB-NATIVE</text>
    <text x="63" y="583" fill="#9ea4b8" font-size="15">Built with GitHub Copilot CLI</text>

    <g transform="translate(630 132)">
      <rect width="520" height="408" rx="24" fill="#0b0d1d" stroke="#3a4167" stroke-width="1.5" filter="url(#shadow)"/>
      <circle cx="27" cy="30" r="4" fill="#a56bff"/>
      <text x="42" y="35" fill="#b9c4e6" font-size="12" font-weight="700" letter-spacing="1">AUTOMATION PULSE</text>
      <text x="490" y="35" text-anchor="end" fill="#9ea4b8" font-size="10" font-weight="700" letter-spacing="1">DEMO DATA</text>

      <rect x="22" y="60" width="230" height="114" rx="14" fill="#1a1d30" stroke="#3a4167"/>
      <text x="39" y="88" fill="#b9c4e6" font-size="11" font-weight="700" letter-spacing="1.4">OPEN TOIL</text>
      <text x="38" y="132" fill="#f7faff" font-size="40" font-weight="700" letter-spacing="-1.5">30.6<tspan fill="#9ea4b8" font-size="19" font-weight="400" letter-spacing="0"> h</tspan></text>
      <text x="40" y="154" fill="#9ea4b8" font-size="11">spent per month</text>
      <rect x="268" y="60" width="230" height="114" rx="14" fill="#0a2a1d" fill-opacity=".78" stroke="#39ff88" stroke-opacity=".24"/>
      <text x="286" y="88" fill="#b9c4e6" font-size="11" font-weight="700" letter-spacing="1.1">TIME RECLAIMED</text>
      <text id="reclaimed-hours" x="285" y="132" fill="#39ff88" font-size="40" font-weight="700" letter-spacing="-1.5">37.3<tspan fill="#b9c4e6" font-size="19" font-weight="400" letter-spacing="0"> h</tspan></text>
      <text x="287" y="154" fill="#9ea4b8" font-size="11">saved per month</text>

      <rect x="22" y="190" width="476" height="195" rx="14" fill="#1a1d30" fill-opacity=".45" stroke="#3a4167"/>
      <text x="40" y="219" fill="#b9c4e6" font-size="12" font-weight="700" letter-spacing="1.1">TOP TIME DRAINS</text>
      <text x="480" y="219" text-anchor="end" fill="#9ea4b8" font-size="9" font-weight="700" letter-spacing=".8">SPENT / MONTH</text>
      <g id="time-drain-circles" fill="url(#drain)" stroke="#ff4d6d" stroke-width="1.8">
        <circle cx="78" cy="278" r="34"/>
        <circle cx="169" cy="278" r="34"/>
        <circle cx="260" cy="278" r="34"/>
        <circle cx="351" cy="278" r="34"/>
        <circle cx="442" cy="278" r="34"/>
      </g>
      <g text-anchor="middle" fill="#f8fbff" font-size="24" font-weight="700" letter-spacing="-.7">
        <text x="78" y="280">16</text>
        <text x="169" y="280">5.5</text>
        <text x="260" y="280">3.3</text>
        <text x="351" y="280">3</text>
        <text x="442" y="280">2.2</text>
      </g>
      <g text-anchor="middle" fill="#9ea4b8" font-size="9">
        <text x="78" y="298">HOURS</text>
        <text x="169" y="298">HOURS</text>
        <text x="260" y="298">HOURS</text>
        <text x="351" y="298">HOURS</text>
        <text x="442" y="298">HOURS</text>
      </g>
      <g text-anchor="middle" fill="#b9c4e6" font-size="10.5">
        <text x="78" y="337">Flaky CI</text>
        <text x="169" y="337">Docs sync</text>
        <text x="260" y="337">Release notes</text>
        <text x="351" y="337">Sandboxes</text>
        <text x="442" y="337">License checks</text>
      </g>
      <path d="M57 360h406" fill="none" stroke="#3a4167" stroke-width="3" stroke-linecap="round"/>
      <path d="M57 360h171" fill="none" stroke="url(#progress)" stroke-width="3" stroke-linecap="round"/>
    </g>
    <rect x="958" y="112" width="171" height="33" rx="16.5" fill="#39ff88" fill-opacity=".14" stroke="#39ff88" stroke-opacity=".55"/>
    <text x="1043.5" y="134" text-anchor="middle" fill="#39ff88" font-size="11.5" font-weight="700" letter-spacing=".9">42% AUTOMATED</text>
    <text x="890" y="574" text-anchor="middle" fill="#b9c4e6" font-size="16">Find the biggest drains. Ship the next win.</text>
  </g>
</svg>
